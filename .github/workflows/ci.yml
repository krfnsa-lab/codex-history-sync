name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional compressed archive decoder
        run: python -m pip install "backports.zstd>=1.0,<2; python_version<'3.14'"
      - name: Run isolated Python tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -q
      - name: Run optional bridge Python tests
        run: python -B -m unittest discover -s vscode-live-sync/tests -p "test_*.py" -q
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @(Get-ChildItem -LiteralPath . -Filter *.ps1) + @(Get-ChildItem -LiteralPath vscode-live-sync -Filter *.ps1)
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "Syntax errors: $($file.FullName): $($parseErrors[0].Message)" }
          }
      - name: Run isolated PowerShell tests
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test_powershell.ps1
      - name: Verify release contents
        run: python -B tools/build_release.py

  bridge-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run optional bridge coordinator and setup tests
        run: node --test vscode-live-sync/vscode-extension/test/bridge.test.js vscode-live-sync/vscode-extension/test/extension.test.js vscode-live-sync/vscode-extension/test/progress.test.js
