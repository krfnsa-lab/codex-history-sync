name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated Python tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -q
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = Get-ChildItem -LiteralPath . -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "Syntax errors: $($file.Name)" }
          }
      - name: Run isolated PowerShell tests
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test_powershell.ps1
      - name: Verify release contents
        run: python -B tools/build_release.py
